<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0078d4" />
    <title>Dataverse IDE</title>

    <script src="./pwa.js"></script>

    <link rel="icon" href="./icons/dataverse-ide.svg" />
    <script type="module" crossorigin src="./assets/index-D8h0RWl7.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CuBCgtGy.css">
  </head>

  <body>
    <div id="splash">
      <div class="splash-inner">
        <h1>Dataverse IDE</h1>
        <p>A browser IDE powered by monaco-vscode-api</p>
        <div class="splash-actions">
          <button id="chooseFolderBtn" class="btn">Open Local Folder…</button>

          <button id="newOpfsWorkspaceBtn" class="btn btn-secondary">New Browser Workspace…</button>
        </div>

        <section class="recent-workspaces" aria-labelledby="recentWorkspacesTitle">
          <div class="recent-workspaces-heading">
            <h2 id="recentWorkspacesTitle">Recent Workspaces</h2>
            <button
              id="refreshRecentWorkspacesBtn"
              class="icon-btn"
              type="button"
              title="Refresh recent workspaces"
              aria-label="Refresh recent workspaces"
            >
              ↻
            </button>
          </div>

          <p id="recentWorkspacesEmpty" class="recent-empty" hidden>No recent workspaces.</p>

          <ul id="recentWorkspacesList" class="recent-workspaces-list" aria-live="polite"></ul>
        </section>
        <p id="splashStatus" class="status"></p>
      </div>
    </div>
    <div id="workbench-container" hidden></div>
  </body>
</html>
